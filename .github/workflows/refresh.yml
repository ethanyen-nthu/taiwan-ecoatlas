name: Refresh validated station snapshots
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
permissions:
  contents: read
concurrency:
  group: station-snapshot-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: vars.ECOATLAS_INGEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Refresh through the authenticated ingestion endpoint
        env:
          ECOATLAS_ORIGIN: ${{ vars.ECOATLAS_ORIGIN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$ECOATLAS_ORIGIN" ]; then
            echo "Required ingestion configuration missing"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            --request POST --header "Authorization: Bearer $CRON_SECRET" \
            "${ECOATLAS_ORIGIN%/}/api/ingest"
